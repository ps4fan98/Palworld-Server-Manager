name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            global.json

      - name: Restore
        run: dotnet restore .\PalworldServerManager.slnx

      - name: Audit NuGet dependencies
        run: dotnet list .\PalworldServerManager.slnx package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build .\PalworldServerManager.slnx -c Release --no-restore