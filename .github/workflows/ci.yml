name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Packages.props
            global.json

      - name: Restore
        run: dotnet restore .\PalworldServerManager.slnx

      - name: Audit NuGet dependencies
        run: dotnet list .\PalworldServerManager.slnx package --vulnerable --include-transitive --no-restore

      - name: Build Release
        run: dotnet build .\PalworldServerManager.slnx -c Release --no-restore

      - name: Build Debug
        run: dotnet build .\PalworldServerManager.slnx -c Debug --no-restore

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester `
            -RequiredVersion 6.0.0 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

      - name: Run PowerShell behavioral tests
        shell: pwsh
        run: Invoke-Pester .\tests\Run-Development.Tests.ps1 -Output Detailed

      - name: Run static asset smoke tests
        shell: pwsh
        run: Invoke-Pester .\tests\StaticAssets.Smoke.Tests.ps1 -Output Detailed
