name: Feature request
description: Propose a focused server-management capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Administrative problem
      description: What server-hosting task is difficult or unsafe today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and networking considerations
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true